appId: com.aibrowser.app
productName: AI-Browser
# 各成果物ごとに <バイナリ名>.sha256 と GPG 署名(.sha256.asc)を生成する
# （単一 SHA256SUMS にしないのは、別環境ビルドを同一リリースに上げる際の上書き防止）
afterAllArtifactBuild: scripts/sign-artifacts.cjs
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: AI-Browser
  icon: build/icon.ico
  # Azure Key Vault + AzureSignTool でコード署名（scripts/sign-win.cjs）
  # 本体 exe と NSIS インストーラの両方がこのフックを通る。
  # electron-builder 26 以降は sign / signingHashAlgorithms は
  # signtoolOptions 配下に移動している。
  signtoolOptions:
    sign: scripts/sign-win.cjs
    signingHashAlgorithms:
      - sha256
nsis:
  artifactName: ${productName}-${version}-setup_win_${arch}.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  hardenedRuntime: true
  notarize: true
  icon: build/icon.icns
  # NOTE:
  # macOS universal (x64+arm64) ビルドの合体工程（@electron/universal）で、
  # node-pty の prebuilds 配下のバイナリが「両アーキで同一ファイル
  # （= 既にuniversal/lipo済み相当）」として検出され、例外ルール未指定だと
  # “Detected file ... not covered by the x64ArchFiles rule” で停止することがあります。
  #
  # `x64ArchFiles` は、そのような”既にマージ済み扱いで再lipoしない”ファイルを
  # minimatch で明示するための設定です。
  #
  # ここでは node-pty の prebuilds 配下（pty.node / spawn-helper など）をまとめて許可します。
  x64ArchFiles: Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/**
  target:
    - target: dmg
      arch: universal
dmg:
  artifactName: ${productName}-${version}_mac_${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}_linux_amd64.${ext}
deb:
  artifactName: ${name}-${version}_linux_amd64.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
